<!DOCTYPE html>
<html>

<head>

<title>SecretTalk Login</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<h1>💬 Welcome Back</h1>


<p>
Login to access your SecretTalk inbox and conversations.
</p>



<div class="heart">
💜
</div>




<input
id="username"
placeholder="Username">



<input
id="password"
type="password"
placeholder="Password">



<button onclick="login()">

Login

</button>



<p id="status"></p>




<div class="divider"></div>



<p>
Don't have a SecretTalk account?
</p>



<button onclick="goSignup()">

Create Account

</button>



</div>






<script type="module" src="login.js"></script>



<script>


function goSignup(){

window.location.href="signup.html";

}


</script>




</body>

</html>
