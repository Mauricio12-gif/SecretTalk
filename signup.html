<!DOCTYPE html>
<html>

<head>

<title>Create SecretTalk Account</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<h1>💬 Create SecretTalk Account</h1>


<input 
id="username"
placeholder="Choose username">


<br><br>


<input 
id="email"
placeholder="Email">


<br><br>


<input 
id="password"
type="password"
placeholder="Password">


<br><br>


<button onclick="signup()">
Create Account
</button>


<p id="status"></p>


</div>


<script type="module" src="signup.js"></script>


</body>

</html>
